name: 编译

on:
  repository_dispatch:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: macOS-26

    steps:
    - name: 准备开始
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: 安装依赖
      run: brew install libplist libimobiledevice libusbmuxd boost capnp google-sparsehash multimarkdown ninja ragel
    - name: 设置环境
      run: export DYLD_FALLBACK_LIBRARY_PATH=/opt/homebrew/Cellar/libplist/2.6.0/lib:/opt/homebrew/Cellar/libimobiledevice/1.3.0_3/lib:/opt/homebrew/Cellar/libusbmuxd/2.1.0/lib
    - name: 装载配置
      run: ./configure
    - name: 开始编译
      run: ninja TextMate
    - name: 上传结果
      uses: actions/upload-artifact@main
      with:
        name: textmate
        path: /Users/runner/build/textmate/release/Applications/TextMate
