name: 编译Arm64

on:
  repository_dispatch:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: macOS-27

    steps:
    - name: 准备开始
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: 设置环境
      run: brew install aria2
      uses: actions/upload-artifact@main
      with:
        name: textmate
        path: /Users/runner/build/textmate/release/Applications/TextMate
