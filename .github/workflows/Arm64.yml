name: 编译Arm64

on:
  repository_dispatch:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: macOS-26

    steps:
    - name: 准备开始
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: 设置环境
      run: brew list aria2
    - name: 上传结果
      uses: actions/upload-artifact@main
      with:
        name: aria2
        path: /opt/homebrew/Cellar/aria2
